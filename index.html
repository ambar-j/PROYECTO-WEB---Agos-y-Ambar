<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cala Cookies - Galletitas Artesanales</title>
    
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <span class="logo-emoji">🍪</span>
                <span>Cala Cookies</span>
            </div>
            <button class="cart-btn" onclick="toggleCart()">
                <span>🛒</span>
                <span>Carrito</span>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </nav>
    </header>

    <div class="hero">
        <span class="hero-emoji">🍪✨🧁</span>
        <h1>¡Bienvenidos a Cala Cookies!</h1>
        <p>Las mejores galletitas, bebidas y postres artesanales 💕</p>
    </div>

    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('todos')">
            <span>🌟</span> Todos
        </button>
        <button class="category-btn" onclick="filterCategory('galletitas')">
            <span>🍪</span> Galletitas
        </button>
        <button class="category-btn" onclick="filterCategory('bebidas')">
            <span>🥤</span> Bebidas
        </button>
        <button class="category-btn" onclick="filterCategory('postres')">
            <span>🍰</span> Postres
        </button>
        <button class="category-btn" onclick="filterCategory('hibridos')">
            <span>✨</span> Híbridos
        </button>
    </div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>🛒 Tu Carrito</h2>
                <button class="close-cart" onclick="toggleCart()">×</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-total" id="cartTotal"></div>
            <button class="checkout-btn" onclick="checkout()">💳 Finalizar Compra</button>
        </div>
    </div>

    <div class="product-modal" id="productModal">
        <div class="product-modal-content">
            <div class="cart-header">
                <h2 id="modalTitle"></h2>
                <button class="close-cart" onclick="closeProductModal()">×</button>
            </div>
            <div class="product-modal-img" id="modalIcon"></div>
            <p id="modalDesc" style="color: #9d7889; line-height: 1.8; margin-bottom: 25px; font-size: 16px; font-weight: 500;"></p>
            <div class="product-price" id="modalPrice"></div>
            <button class="add-to-cart" onclick="addFromModal()">🛒 Agregar al Carrito</button>
        </div>
    </div>
<script type="text/javascript" src="script.js"></script>
</body>
</html>
